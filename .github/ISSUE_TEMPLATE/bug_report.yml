name: Relatar problema
description: Envie informações para ajudar a corrigir um erro
labels: ["bug"]
assignees:
  - MarlonPassos-git
body:
  - type: input
    id: app-version
    attributes:
      label: Versão do Klick'r
      placeholder: "4.0.0-beta05"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Origem do APK
      description: Informe de onde o aplicativo foi instalado
      options:
        - GitHub deste repositório
        - F-Droid
        - Play Store
        - Compilação local
      default: 0
    validations:
      required: true

  - type: input
    id: device-type
    attributes:
      label: Marca e modelo do aparelho
      placeholder: Samsung Galaxy S23+
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Versão do Android
      description: Normalmente disponível em Configurações → Sobre o telefone
      placeholder: "14"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Área afetada
      description: Em qual parte do aplicativo ocorreu o problema?
      options:
        - Cenário inteligente
        - Cenário regular
        - Backup
        - Outra
      default: 0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: |
        Liste os passos exatos para reproduzir o problema e anexe capturas de tela ou um vídeo. \
        Se o erro envolver uma condição, ação ou evento, anexe um backup ZIP com o menor cenário capaz de reproduzi-lo.
      placeholder: Descreva o problema e os passos para reproduzi-lo
    validations:
      required: true

  - type: textarea
    id: what-should-happened
    attributes:
      label: O que deveria ter acontecido?
      description: Descreva o resultado esperado
      placeholder: Explique como o aplicativo deveria ter reagido
    validations:
      required: true

  - type: checkboxes
    id: duplicate
    attributes:
      label: Verificação de duplicidade
      description: |
        Confira se o problema ainda não foi relatado. \
        [Lista de problemas abertos](https://github.com/MarlonPassos-git/Smart-AutoClicker/issues?q=is%3Aissue%20state%3Aopen%20label%3Abug)
        
      options:
        - label: Não encontrei um relato duplicado
          required: true

  - type: checkboxes
    id: attachements
    attributes:
      label: Arquivos e informações
      description: |
        Inclua capturas de tela ou vídeo sempre que possível. \
        Para erros de execução, envie um cenário mínimo em vez de um backup completo com eventos não relacionados. \
        Para erros de importação, anexe o arquivo ZIP que apresenta o problema. \
        Relatos sem informações suficientes podem ser fechados até receberem os dados necessários.
        
      options:
        - label: Anexei os arquivos necessários ou expliquei por que não estão disponíveis
          required: true
