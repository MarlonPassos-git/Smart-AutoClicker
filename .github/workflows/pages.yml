name: Publicar página de download

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar documentação
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos
        run: |
          touch docs/.nojekyll
          node --test docs/__tests__/*.spec.mjs

      - name: Enviar página
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
