<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Descubra e baixe o APK recomendado do Klick'r para seu aparelho Android.">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="images/klickr.png">
    <title>Qual APK devo instalar? — Klick'r</title>
    <style>
      :root {
        color-scheme: light;
        --background: #ffffff;
        --text: #111318;
        --muted: #4f5868;
        --border: #cfd6e3;
        --accent: #1261df;
        --accent-hover: #0b4fbf;
        --success: #20a956;
        --disabled: #aeb7c6;
        --radius: 16px;
        --shadow: 0 10px 28px rgb(17 19 24 / 8%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      main {
        width: min(100% - 40px, 760px);
        margin: 0 auto;
        padding: 36px 0 48px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: clamp(56px, 10vh, 104px);
        color: var(--text);
        font-size: 1.3rem;
        font-weight: 750;
        text-decoration: none;
      }

      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        box-shadow: var(--shadow);
      }

      h1 {
        max-width: 700px;
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 4.6rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 650px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(1.1rem, 3.8vw, 1.45rem);
        line-height: 1.55;
      }

      .detected-device {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 38px 0 34px;
        font-size: clamp(1.2rem, 4vw, 1.6rem);
        font-weight: 750;
      }

      .detected-device svg {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        color: var(--success);
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 1rem;
        font-weight: 700;
      }

      select {
        width: 100%;
        min-height: 66px;
        padding: 0 52px 0 18px;
        border: 2px solid var(--accent);
        border-radius: var(--radius);
        background: var(--background);
        color: var(--text);
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.3;
      }

      select:focus-visible,
      .download:focus-visible,
      a:focus-visible {
        outline: 4px solid rgb(18 97 223 / 22%);
        outline-offset: 3px;
      }

      .download {
        display: flex;
        min-height: 68px;
        margin-top: 26px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border-radius: var(--radius);
        background: var(--accent);
        color: #ffffff;
        font-size: 1.08rem;
        font-weight: 750;
        text-align: center;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .download:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      .download[aria-disabled="true"] {
        background: var(--disabled);
        pointer-events: none;
        transform: none;
      }

      .download svg {
        width: 24px;
        height: 24px;
      }

      .tutorial-link,
      footer a {
        color: var(--accent);
        text-underline-offset: 4px;
      }

      .tutorial-link {
        display: block;
        width: fit-content;
        margin: 28px auto 0;
        font-size: 1.05rem;
      }

      .recommendation-note,
      .release-status {
        color: var(--muted);
        line-height: 1.55;
      }

      .recommendation-note {
        margin: 36px 0 0;
      }

      .release-status {
        min-height: 24px;
        margin: 14px 0 0;
        font-size: 0.92rem;
      }

      .release-status[data-state="error"] {
        color: #a12d2d;
      }

      footer {
        margin-top: clamp(88px, 18vh, 180px);
        padding-top: 28px;
        border-top: 1px solid var(--border);
        text-align: center;
      }

      @media (min-width: 700px) {
        main {
          padding-top: 52px;
        }

        .download {
          width: fit-content;
          min-width: 360px;
          padding: 0 32px;
        }

        .tutorial-link {
          margin-left: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .download {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="https://github.com/MarlonPassos-git/Smart-AutoClicker">
        <img src="images/klickr.png" alt="">
        <span>Klick'r</span>
      </a>

      <h1>Qual APK devo instalar?</h1>
      <p class="intro">Verificamos seu aparelho e recomendamos a opção mais segura disponível.</p>

      <p class="detected-device" aria-live="polite">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.7 7.8-5.3 5.3a1 1 0 0 1-1.4 0l-2.7-2.7 1.4-1.4 2 2 4.6-4.6 1.4 1.4Z"/>
        </svg>
        <span id="device-status">Verificando aparelho…</span>
      </p>

      <label for="apk-architecture">Arquitetura do aparelho</label>
      <select id="apk-architecture">
        <option value="arm64-v8a">arm64-v8a — celulares atuais</option>
        <option value="armeabi-v7a">armeabi-v7a — celulares antigos</option>
        <option value="x86_64">x86_64 — emuladores atuais</option>
        <option value="x86">x86 — emuladores antigos</option>
        <option value="universal">universal — maior compatibilidade</option>
      </select>

      <a id="download-apk" class="download" aria-disabled="true">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/>
        </svg>
        <span>Preparando download…</span>
      </a>

      <p id="release-status" class="release-status" aria-live="polite"></p>

      <a class="tutorial-link" href="https://github.com/MarlonPassos-git/Smart-AutoClicker/blob/master/docs/INSTALACAO-E-CONFIGURACAO.md">
        Ver instalação e configuração
      </a>

      <p class="recommendation-note">
        A detecção é uma recomendação. Você pode alterar a opção antes de baixar.
      </p>

      <footer>
        <a href="https://github.com/MarlonPassos-git/Smart-AutoClicker">Projeto no GitHub</a>
      </footer>
    </main>

    <script type="module" src="assets/seletor-apk.mjs"></script>
  </body>
</html>
